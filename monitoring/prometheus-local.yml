# The scrape config used by docker-compose.monitoring.yml.
# Identical idea to prometheus.yml, but the target is the compose service name.

global:
  scrape_interval: 5s # faster than production, so the graphs move while you watch
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: "devsecops-lab"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]
        labels:
          env: local
          pod: app-local # the k8s config sets this from the real pod name

  # Prometheus scrapes itself. Handy proof that /metrics is just an HTTP endpoint.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
